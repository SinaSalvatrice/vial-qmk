name: Build rp2040 vial QMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # QMK uses a bunch of system packages; this covers the common basics
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            gcc \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            avr-libc \
            dfu-programmer \
            dfu-util \
            teensy-loader-cli \
            python3-pip \
            unzip \
            wget \
            zip

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: Setup QMK firmware
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          qmk setup -H $GITHUB_WORKSPACE -y
          git submodule update --init --recursive

      # This compiles using the QMK CLI.
      - name: Compile firmware
        env:
          KEYBOARD: "rp2040_handwired_4x6"
          KEYMAP: "sina"
        run: |
          qmk compile -kb "$KEYBOARD" -km "$KEYMAP"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040_vial_firmware
          path: |
            ${{ github.workspace }}/*.uf2
            ${{ github.workspace }}/.build/*.uf2
            ${{ github.workspace }}/*.hex
            ${{ github.workspace }}/.build/*.hex
            ${{ github.workspace }}/*.bin
            ${{ github.workspace }}/.build/*.bin
          if-no-files-found: error
